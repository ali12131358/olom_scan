[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrotik-authorized-scanner"
version = "1.0.0"
description = "Authorized IPv4 scanner with MikroTik service reporting"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["scanner_lib*"]
